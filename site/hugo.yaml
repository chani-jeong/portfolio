  about:
    enable: true
    title: 소개
    content: |-
      전북대학교 **국제학부**에 소속되어 있고, 컴퓨터인공지능학부 **인공지능전공**을 복수전공하고 있는 2학년 학생입니다.

      **관심 분야** — 사용자의 문제를 현장에서 확인하고, 그 결과를 웹 서비스 기능으로 바꾸는 일에 관심이 있습니다.

      **관심을 갖게 된 이유** — 팀 프로젝트 [Odigo](#experience)에서 외국인 관광객을 직접 만나 테스트했을 때, 자국어 정보가 부족하다는 응답(80%)을 다국어 기능으로 바꾸자 방문 의향 응답(88%)으로 이어지는 것을 확인했습니다. 기능 하나가 실제 사용자 행동을 바꾸는 과정을 경험한 뒤 이 분야를 더 깊게 공부하고 싶어졌습니다.

      **학습 목표** — 2026년 11월 SQLD(SQL 개발자) 자격증 취득.

      **다음 행동** — SQLD 스터디에 참여해 기출 문제와 이론을 정리하고, 시험 전까지 기출 문제를 반복해서 풉니다.

      **기술 적용 사례**

      **Git · GitHub, GitHub Actions** — 초급프로젝트 수업 실습에서 정적 사이트, Vue 영화 앱, React 할 일 앱을 GitHub Pages로 배포했고, 이 포트폴리오도 main 브랜치에 push하면 GitHub Actions로 자동 배포되도록 구성했습니다.

      **Firebase** — Odigo에서 데이터 저장에 사용했고, 수업 실습에서는 Firebase Authentication과 Firestore로 로그인한 사용자만 자기 할 일을 읽고 쓰는 앱을 만들었습니다.
